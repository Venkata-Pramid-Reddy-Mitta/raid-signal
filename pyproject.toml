[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raid-signal"
version = "0.1.0"
description = "Statistical process control over a RAID log, so a blocker spike trips a gate before a human escalates."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Venkata Pramid Reddy Mitta" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "coverage>=7.3",
    "ruff>=0.5",
]
evidence = [
    "playwright>=1.40",
    "cmarkgfm>=2024.1",
]

[project.scripts]
raid-signal = "raid_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["raid_signal"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
